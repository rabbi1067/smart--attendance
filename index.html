<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Attendance</title>
<meta name="description" content="Daily attendance system">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="dns-prefetch" href="https://script.google.com">
<link rel="dns-prefetch" href="https://script.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--pri:#4f46e5;--pri2:#7c3aed;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--shadow:0 10px 30px rgba(15,23,42,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#141a2e;--text:#e8ecf8;--muted:#8d97b5;--line:#252d4a;--shadow:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#141a2e;--text:#e8ecf8;--muted:#8d97b5;--line:#252d4a;--shadow:0 10px 30px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;transition:background .3s,color .3s}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:22px 16px 80px}
.wrap{max-width:980px;margin:0 auto}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.tools{display:flex;gap:8px}
.btn-i{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;backdrop-filter:blur(6px)}
.btn-i:hover{background:rgba(255,255,255,.28)}
.dateblock{margin-top:26px;text-align:center}
.date{font-size:clamp(1.3rem,4.5vw,2.1rem);font-weight:700}
.clock{font-size:clamp(2rem,8vw,3.6rem);font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums;opacity:.95}
.main{max-width:980px;margin:-56px auto 40px;padding:0 16px;display:grid;grid-template-columns:380px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:780px){.main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);min-width:0}
h2{margin:0 0 14px;font-size:1.1rem}
label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 6px}
.opt{color:var(--muted);font-weight:400}
input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:1rem;outline:none;transition:border .2s,box-shadow .2s}
input:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(79,70,229,.15)}
input.err{border-color:var(--bad)}
.hint{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-top:5px}
.submit{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;transition:transform .15s,opacity .2s;white-space:nowrap}
.submit:hover{transform:translateY(-1px)}.submit:disabled{opacity:.6;cursor:wait}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.count{background:rgba(79,70,229,.12);color:var(--pri);padding:4px 12px;border-radius:99px;font-weight:700;font-size:.85rem}
.tw{max-height:380px;overflow-y:auto;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{width:36px;text-align:center}
th:last-child,td:last-child{width:36px;text-align:center}
th{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;background:var(--card)}
.tick{color:var(--ok);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:34px 0}
.link{display:block;text-align:center;margin-top:14px;color:var(--pri);font-weight:600;text-decoration:none}
.demo{background:rgba(217,119,6,.12);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.8rem;margin-bottom:12px}
.timer-banner{padding:10px 14px;border-radius:12px;font-size:.85rem;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;line-height:1.4}
.timer-banner.open{background:rgba(79,70,229,.12);color:var(--pri);border:1px solid rgba(79,70,229,.25)}
.timer-banner.closed{background:rgba(220,38,38,.12);color:var(--bad);border:1px solid rgba(220,38,38,.25)}
.timer-banner.before{background:rgba(217,119,6,.12);color:var(--warn);border:1px solid rgba(217,119,6,.25)}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;width:min(92vw,380px)}
.toast{display:flex;gap:10px;align-items:center;padding:13px 16px;border-radius:14px;color:#fff;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:in .3s ease}
.toast.ok{background:var(--ok)}.toast.err{background:var(--bad)}.toast.warn{background:var(--warn)}
.toast.out{opacity:0;transform:translateY(-10px);transition:.3s}
@keyframes in{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#22d3ee,#a78bfa);z-index:60;transition:width .3s,opacity .3s;opacity:0}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.sk td{padding:12px 8px}.sk span{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
#syncBtn.spinning{animation:sp .7s linear infinite}
</style>
</head>
<body>
<div id="bar"></div>
<div id="toasts" aria-live="polite"></div>
<header class="hero"><div class="wrap">
  <div class="bar">
    <div class="brand"><span>🗓️</span><span data-t="title"></span></div>
    <div class="tools"><button class="btn-i" id="lang">বাংলা</button><button class="btn-i" id="theme" aria-label="Theme">🌙</button></div>
  </div>
  <div class="dateblock"><div class="date" id="date"></div><div class="clock" id="clock"></div></div>
</div></header>

<main class="main">
  <section class="card">
    <h2 data-t="formTitle"></h2>
    <div id="timerBanner" class="timer-banner" hidden></div>
    <label for="name" data-t="name"></label>
    <input id="name" autocomplete="name" data-p="namePh">
    <label for="sid" data-t="id"></label>
    <input id="sid" inputmode="numeric" maxlength="13" autocomplete="off" placeholder="2023200000686">
    <div class="hint"><span data-t="idHint"></span><span id="cnt">0/13</span></div>
    <label for="email"><span data-t="email"></span> <span class="opt" data-t="opt"></span></label>
    <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com">
    <button class="submit" id="go" data-t="submit"></button>
  </section>

  <section class="card">
    <div class="head">
      <div style="display:flex;align-items:center;gap:8px">
        <h2 style="margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span data-t="today"></span>
          <span id="classBadge" style="font-size:.78rem;color:var(--pri);background:rgba(79,70,229,.12);padding:2px 8px;border-radius:6px;font-weight:600;display:none"></span>
        </h2>
        <button id="syncBtn" type="button" title="Refresh list from Sheet" style="background:transparent;border:0;cursor:pointer;font-size:1.05rem;padding:2px 4px;border-radius:6px;opacity:.7;transition:transform .3s,opacity .2s">🔄</button>
      </div>
      <span class="count" id="total">0</span>
    </div>
    <div class="demo" id="demo" hidden data-t="demo"></div>
    <div class="tw"><table><thead><tr><th>#</th><th data-t="name"></th><th data-t="id"></th><th data-t="time"></th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    <a class="link" id="view" target="_blank" rel="noopener" hidden data-t="view"></a>
  </section>
</main>

<script src="config.js"></script>
<script>
/* ====== CONFIG: paste your links here after deploying Apps Script ====== */
const CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxh6GVxU4WhKqGyALl5IexU8sFFyATK4dzIPC_zVex0U5E1rLRt6p3vKJPflvkXcJyN/exec",   // Apps Script Web App URL (ends with /exec). Empty = demo mode
  SHEET_URL: "https://docs.google.com/spreadsheets/d/1SWVflizfr5ro1tXGnDuXSb1_f0QWHs4-rLjKy4khgP4/edit?gid=0#gid=0"     // Public (view-only) Google Sheet link
};

// config.js থেকে SCHEDULE_CONFIG বা TIMER_CONFIG লোড হবে:
const getScheduleConfig = () => {
  if (typeof SCHEDULE_CONFIG !== "undefined") return SCHEDULE_CONFIG;
  if (typeof TIMER_CONFIG !== "undefined") return TIMER_CONFIG;
  return { ENABLED: false };
};

const T = {
 en:{title:"Smart Attendance",formTitle:"Mark your attendance",name:"Name",namePh:"Your full name",id:"Student ID",idHint:"13 digits, numbers only",email:"Email",opt:"(optional)",submit:"Submit Attendance ✓",today:"Today’s Attendance",time:"Time",view:"View all records →",demo:"Demo mode: data is not saved. Add your Apps Script URL to go live.",
  ok:"Present recorded successfully!",badId:"Invalid ID: it must be exactly 13 digits.",badName:"Please enter your name.",badEmail:"Invalid email address.",dup:"This ID has already been marked for this class.",net:"Network error. Please try again.",rate:"Too many attempts. Please wait a few seconds.",busy:"Server is busy. Please try again in a moment.",wait:"Submitting…",srv:"Something went wrong. Please try again.",dark:"🌙",light:"☀️",
  closed:"Attendance is closed.",timeRemaining:"Time remaining",startsIn:"Starts in",closedBtn:"Closed",nextClass:"Next class",allDone:"All classes completed for today"},
 bn:{title:"স্মার্ট এটেন্ডেন্স",formTitle:"আপনার হাজিরা দিন",name:"নাম",namePh:"আপনার পুরো নাম",id:"স্টুডেন্ট আইডি",idHint:"১৩ ডিজিট, শুধু সংখ্যা",email:"ইমেইল",opt:"(ঐচ্ছিক)",submit:"হাজিরা জমা দিন ✓",today:"আজকের হাজিরা",time:"সময়",view:"সব রেকর্ড দেখুন →",demo:"ডেমো মোড: ডেটা সেভ হচ্ছে না। লাইভ করতে Apps Script URL বসান।",
  ok:"উপস্থিতি সফলভাবে সংরক্ষিত হয়েছে!",badId:"ভুল আইডি: অবশ্যই ১৩ ডিজিট হতে হবে।",badName:"অনুগ্রহ করে আপনার নাম লিখুন।",badEmail:"ইমেইল ঠিকানা সঠিক নয়।",dup:"এই আইডি দিয়ে এই ক্লাসে ইতিমধ্যে হাজিরা দেওয়া হয়েছে।",net:"নেটওয়ার্ক সমস্যা। আবার চেষ্টা করুন।",rate:"অনেকবার চেষ্টা হয়েছে। কয়েক সেকেন্ড অপেক্ষা করুন।",busy:"সার্ভার ব্যস্ত। একটু পরে আবার চেষ্টা করুন।",wait:"জমা হচ্ছে…",srv:"কিছু ভুল হয়েছে। আবার চেষ্টা করুন।",dark:"🌙",light:"☀️",
  closed:"হাজিরা নেওয়া বন্ধ আছে।",timeRemaining:"সময় বাকি",startsIn:"শুরু হতে বাকি",closedBtn:"বন্ধ আছে",nextClass:"পরবর্তী ক্লাস",allDone:"আজকের সব ক্লাস সম্পন্ন হয়েছে"}
};
let lang = "en", rows = [];
try{ lang = localStorage.getItem("lang") || "en"; }catch(e){}
const $ = id => document.getElementById(id);
const p2 = n => String(n).padStart(2,"0");
const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); };

const getCacheKey = (c) => "att_rows_" + todayStr() + (c ? "_" + String(c).replace(/\s+/g,"_") : "");
function loadLocalRows(c){
  try{
    const cached = localStorage.getItem(getCacheKey(c));
    if(cached){
      const parsed = JSON.parse(cached);
      if(Array.isArray(parsed)) return parsed;
    }
  }catch(e){}
  return [];
}
function saveRows(data, c){
  rows = data;
  try{ localStorage.setItem(getCacheKey(c || (timerState && timerState.cls)), JSON.stringify(rows)); }catch(e){}
  render();
}
const timeStr = () => {
  const d = new Date();
  let h = d.getHours();
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return h + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds()) + " " + ampm;
};
const loc = () => lang==="bn" ? "bn-BD" : "en-GB";
const mask = s => s.slice(0,4)+"•••••"+s.slice(-4);

function formatTime(val){
  if(!val) return "";
  const str = String(val).trim();
  const m12 = str.match(/^(\d{1,2}):(\d{2}):(\d{2})\s*(AM|PM|am|pm)$/i);
  if(m12){
    const h = parseInt(m12[1], 10);
    return h + ":" + m12[2] + ":" + m12[3] + " " + m12[4].toUpperCase();
  }
  const m24 = str.match(/(?:^|\s|T)(\d{1,2}):(\d{2}):(\d{2})/);
  if(m24){
    let h = parseInt(m24[1], 10);
    const ampm = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    return h + ":" + m24[2] + ":" + m24[3] + " " + ampm;
  }
  return str;
}

function parseTimeToday(tStr) {
  if (!tStr) return null;
  const d = new Date();
  const str = String(tStr).trim();
  const m12 = str.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?$/i);
  if (!m12) return null;
  let h = parseInt(m12[1], 10);
  const m = parseInt(m12[2], 10);
  const s = m12[3] ? parseInt(m12[3], 10) : 0;
  const ampm = m12[4] ? m12[4].toUpperCase() : null;
  if (ampm === "PM" && h < 12) h += 12;
  if (ampm === "AM" && h === 12) h = 0;
  d.setHours(h, m, s, 0);
  return d;
}

function formatDiff(sec) {
  if (sec < 0) sec = 0;
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (lang === "bn") {
    const toBn = num => String(num).replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
    if (h > 0) return `${toBn(h)} ঘণ্টা ${toBn(m)} মিনিট ${toBn(s)} সেকেন্ড`;
    return `${toBn(m)} মিনিট ${toBn(s)} সেকেন্ড`;
  }
  if (h > 0) return `${h}h ${m}m ${s}s`;
  return `${m}m ${s}s`;
}

let timerState = { allowed: true, cls: "" };
let lastActiveCls = null;

function updateTimer() {
  const banner = $("timerBanner");
  const badge = $("classBadge");
  const cfg = getScheduleConfig();

  if (!cfg || !cfg.ENABLED) {
    if (banner) banner.hidden = true;
    if (badge) badge.style.display = "none";
    timerState = { allowed: true, cls: "" };
    if (!busy) {
      $("name").disabled = $("sid").disabled = $("email").disabled = false;
      $("go").disabled = false;
      if ($("go").textContent !== T[lang].submit) $("go").textContent = T[lang].submit;
    }
    return;
  }

  // Normalize classes list
  let classList = [];
  if (Array.isArray(cfg.CLASSES) && cfg.CLASSES.length > 0) {
    classList = cfg.CLASSES;
  } else if (cfg.START_TIME && cfg.END_TIME) {
    classList = [{ name: cfg.NAME || "Class", start: cfg.START_TIME, end: cfg.END_TIME }];
  }

  const now = new Date();
  let activeClass = null, activeEnd = null;
  let nextClass = null, nextStart = null;

  for (const c of classList) {
    const s = parseTimeToday(c.start);
    const e = parseTimeToday(c.end);
    if (!s || !e) continue;

    if (now >= s && now <= e) {
      activeClass = c;
      activeEnd = e;
      break;
    } else if (now < s) {
      if (!nextClass || s < nextStart) {
        nextClass = c;
        nextStart = s;
      }
    }
  }

  // Detect class transition and auto-refresh table
  const currentClsName = activeClass ? activeClass.name : (nextClass ? nextClass.name : "");
  if (lastActiveCls !== null && lastActiveCls !== currentClsName) {
    lastActiveCls = currentClsName;
    rows = loadLocalRows(currentClsName);
    render();
    load(true);
  } else if (lastActiveCls === null) {
    lastActiveCls = currentClsName;
    rows = loadLocalRows(currentClsName);
  }

  if (activeClass) {
    const diff = Math.floor((activeEnd - now) / 1000);
    timerState = { allowed: true, cls: activeClass.name, state: "open" };
    if (banner) {
      banner.hidden = false;
      banner.className = "timer-banner open";
      banner.innerHTML = `<span>🟢</span><span><strong>${esc(activeClass.name)}</strong> ${lang === "bn" ? "চলছে" : "in session"} | ${T[lang].timeRemaining}: <strong>${formatDiff(diff)}</strong></span>`;
    }
    if (badge) {
      badge.textContent = activeClass.name;
      badge.style.display = "inline-block";
    }
    if (!busy) {
      $("name").disabled = $("sid").disabled = $("email").disabled = false;
      $("go").disabled = false;
      if ($("go").textContent !== T[lang].submit) $("go").textContent = T[lang].submit;
    }
    return;
  }

  if (nextClass) {
    const diff = Math.floor((nextStart - now) / 1000);
    timerState = { allowed: false, cls: nextClass.name, state: "before" };
    if (banner) {
      banner.hidden = false;
      banner.className = "timer-banner before";
      banner.innerHTML = `<span>⏳</span><span>${T[lang].nextClass}: <strong>${esc(nextClass.name)}</strong> (${nextClass.start}) | ${T[lang].startsIn}: <strong>${formatDiff(diff)}</strong></span>`;
    }
    if (badge) {
      badge.textContent = nextClass.name + (lang === "bn" ? " (আসন্ন)" : " (Upcoming)");
      badge.style.display = "inline-block";
    }
    $("name").disabled = $("sid").disabled = $("email").disabled = $("go").disabled = true;
    $("go").textContent = "🔒 " + T[lang].closedBtn;
    return;
  }

  // All classes ended for today
  timerState = { allowed: false, cls: "", state: "after" };
  if (banner) {
    banner.hidden = false;
    banner.className = "timer-banner closed";
    banner.innerHTML = `<span>⛔</span><span>${T[lang].allDone}</span>`;
  }
  if (badge) badge.style.display = "none";
  $("name").disabled = $("sid").disabled = $("email").disabled = $("go").disabled = true;
  $("go").textContent = "⛔ " + T[lang].closedBtn;
}

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = T[lang][e.dataset.t]);
  document.querySelectorAll("[data-p]").forEach(e => e.placeholder = T[lang][e.dataset.p]);
  $("lang").textContent = lang==="en" ? "বাংলা" : "English";
  document.title = T[lang].title; tick(); render(); updateTimer();
}
function tick(){
  const d = new Date();
  $("date").textContent = d.toLocaleDateString(loc(),{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  $("clock").textContent = d.toLocaleTimeString(loc(),{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true});
  updateTimer();
}
setInterval(tick,1000);

function toast(msg,type){
  const el = document.createElement("div");
  el.className = "toast "+type;
  el.textContent = (type==="ok"?"✅ ":type==="err"?"⛔ ":"⚠️ ")+msg;
  $("toasts").appendChild(el);
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(),320); },3200);
}

function render(){
  $("total").textContent = rows.length.toLocaleString(loc());
  $("rows").innerHTML = rows.length ? rows.map((r,i)=>
    "<tr><td>"+(i+1).toLocaleString(loc())+"</td><td>"+esc(r.name)+"</td><td>"+esc(r.idm||mask(String(r.id)))+"</td><td>"+esc(formatTime(r.time))+"</td><td class='tick'>✔</td></tr>").join("")
    : "<tr><td colspan='5' class='empty'>—</td></tr>";
}
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let busy=false,lastSubmit=0,lastLoad=0,failCount=0,loading=false,firstLoad=rows.length===0,pollTimer=null,barTimer=null;
const bar=$("bar");
function barStart(){clearTimeout(barTimer);bar.style.opacity=1;bar.style.width="70%";}
function barDone(){bar.style.width="100%";barTimer=setTimeout(()=>{bar.style.opacity=0;bar.style.width="0";},300);}
function fetchT(url,opt,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||12000);return fetch(url,Object.assign({signal:c.signal},opt)).finally(()=>clearTimeout(t));}

async function load(force){
  if(!CONFIG.SCRIPT_URL||loading) return;
  if(!force && Date.now()-lastLoad<2500) return;
  loading=true; lastLoad=Date.now();
  const syncBtn = $("syncBtn");
  if(syncBtn) syncBtn.classList.add("spinning");

  if(!rows.length){
    $("rows").innerHTML = `<tr class="empty"><td colspan="5" style="padding:28px 0;color:var(--muted)">
      <span class="spin" style="border-color:var(--pri);border-top-color:transparent;width:15px;height:15px;display:inline-block;vertical-align:middle;margin-right:8px"></span>
      ${lang==="bn"?"হাজিরা লোড হচ্ছে…":"Loading attendance…"}
    </td></tr>`;
  }

  const clsParam = timerState.cls ? ("&cls=" + encodeURIComponent(timerState.cls)) : "";
  try{
    const url = CONFIG.SCRIPT_URL + "?date=" + todayStr() + clsParam + (force ? "&force=1" : "") + "&_t=" + Date.now();
    const r = await fetchT(url);
    const j = await r.json();
    if(j.ok && Array.isArray(j.rows)){
      saveRows(j.rows, timerState.cls);
      failCount = 0;
    } else {
      failCount++;
    }
  }catch(e){
    failCount++;
  }finally{
    loading = false;
    firstLoad = false;
    if(syncBtn) syncBtn.classList.remove("spinning");
    render();
    schedule();
  }
}
function schedule(){
  clearTimeout(pollTimer);
  const wait=Math.min(20000*Math.pow(2,failCount),120000)+Math.random()*3000;
  pollTimer=setTimeout(()=>{document.hidden?schedule():load();},wait);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden) load();});

$("sid").addEventListener("input",e=>{
  e.target.value = e.target.value.replace(/\D/g,"").slice(0,13);
  $("cnt").textContent = e.target.value.length+"/13"; e.target.classList.remove("err");
});

$("go").addEventListener("click", async ()=>{
  if(busy) return;
  const cfg = getScheduleConfig();
  if(cfg && cfg.ENABLED && !timerState.allowed){
    return toast(T[lang].closed, "warn");
  }
  const name=$("name").value.trim(), id=$("sid").value.trim(), email=$("email").value.trim(), t=T[lang];
  if(name.length<2){ $("name").classList.add("err"); return toast(t.badName,"err"); }
  if(!/^\d{13}$/.test(id)){ $("sid").classList.add("err"); return toast(t.badId,"err"); }
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ $("email").classList.add("err"); return toast(t.badEmail,"err"); }
  if(Date.now()-lastSubmit<1500) return toast(t.rate,"warn");
  busy=true; lastSubmit=Date.now();
  const btn=$("go");
  barStart();

  const formattedNow = formatTime(timeStr());
  const curCls = timerState.cls || "";
  const payload={date:todayStr(),cls:curCls,name,id,email,time:formattedNow};
  const newRow={name, id, idm:mask(id), time:formattedNow};

  // ⚡ INSTANT INSERTION (< 0.2s): Table updates immediately, form clears, toast pops up
  rows.push(newRow);
  saveRows(rows, curCls);
  clearForm();
  toast(t.ok,"ok");

  btn.disabled = true;
  btn.textContent = (lang === "bn" ? "✓ জমা হয়েছে" : "✓ Submitted");

  try{
    if(CONFIG.SCRIPT_URL){
      const r=await fetchT(CONFIG.SCRIPT_URL,{method:"POST",body:JSON.stringify(payload)},15000);
      const j=await r.json();
      if(!j.ok){
        // Rollback optimistic row if rejected by server
        rows = rows.filter(r => r.id !== id && r.idm !== mask(id));
        saveRows(rows, curCls);
        if(j.error==="dup"){
          $("sid").classList.add("err");
          toast(t.dup,"warn");
        } else if(j.error==="rate"){
          toast(t.rate,"warn");
        } else if(j.error==="busy"){
          toast(t.busy,"warn");
        } else if(j.error==="bad_id"){
          $("sid").classList.add("err");
          toast(t.badId,"err");
        } else {
          toast(t.srv,"err");
        }
      }
    }
  }catch(e){
    toast(t.net,"err");
  } finally {
    barDone();
    setTimeout(()=>{
      btn.disabled = false;
      btn.textContent = T[lang].submit;
      busy = false;
    }, 600);
  }
});
function clearForm(){ ["name","sid","email"].forEach(k=>$(k).value=""); $("cnt").textContent="0/13"; }

if($("syncBtn")) $("syncBtn").addEventListener("click",()=>load(true));

function setTheme(m){
  document.documentElement.dataset.theme = m;
  $("theme").textContent = m==="dark" ? T[lang].light : T[lang].dark;
  try{ localStorage.setItem("theme",m); }catch(e){}
}
$("theme").addEventListener("click",()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"));
$("lang").addEventListener("click",()=>{ lang = lang==="en"?"bn":"en"; try{localStorage.setItem("lang",lang);}catch(e){} applyLang(); setTheme(document.documentElement.dataset.theme); });

let saved = null; try{ saved = localStorage.getItem("theme"); }catch(e){}
setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
if(CONFIG.SHEET_URL){ $("view").href = CONFIG.SHEET_URL; $("view").hidden = false; }
$("demo").hidden = !!CONFIG.SCRIPT_URL;
applyLang();
render();
load();
</script>
</body>
</html>
