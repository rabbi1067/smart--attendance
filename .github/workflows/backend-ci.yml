name: Spring Boot backend checks
on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'Code.gs'
      - 'tests/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'Code.gs'
      - 'tests/**'
      - '.github/workflows/backend-ci.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Apps Script email and duplicate guards
        run: npm test
      - name: Run automated Spring Boot tests
        working-directory: backend
        run: mvn -B test
