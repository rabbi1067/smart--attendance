name: Deploy Smart Attendance to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate backend API URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [[ ! "$API_BASE_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "Set repository variable API_BASE_URL to https://YOUR-SERVICE.onrender.com" >&2
            exit 1
          fi
      - name: Build GitHub Pages website
        working-directory: frontend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
