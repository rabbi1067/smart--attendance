services:
  # =========================================================================
  # Smart Attendance • All-in-One Single Service (Frontend + Backend Bundled)
  # =========================================================================
  - type: web
    name: smart-attendance
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_OWNER_EMAIL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_ENCRYPTION_KEY
        sync: false
