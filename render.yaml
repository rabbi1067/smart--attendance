services:
  # 1. Backend Web Service (Spring Boot 3.4 / Docker)
  - type: web
    name: smart-attendance-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_OWNER_EMAIL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        fromService:
          type: web
          name: smart-attendance-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # 2. Frontend Static Site (HTML / JS / CSS)
  - type: web
    name: smart-attendance-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: smart-attendance-backend
          envVarKey: RENDER_EXTERNAL_URL
